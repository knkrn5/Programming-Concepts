 font-family: Helvetica; color: light-dark(#000000, #ffffff); line-height: 1.2; pointer-events: all; white-space: normal; word-wrap: normal; ">Nodejs V8 engine</div></div></div></foreignObject><text x="165" y="19" fill="#000000" font-family="Helvetica" font-size="12px" text-anchor="middle" style="fill: light-dark(rgb(0, 0, 0), rgb(255, 255, 255));">Nodejs V8 engine</text></switch></g></g><g data-cell-id="li4cvuyOgZzYEVIkjxM--2"><g transform="translate(0.5,0.5)"><rect x="10" y="30" width="310" height="30" fill="none" stroke="#000000" stroke-dasharray="1 4" pointer-events="all" style="stroke: light-dark(rgb(0, 0, 0), rgb(255, 255, 255));"/></g><g><g><switch><foreignObject style="overflow: visible; text-align: left;" pointer-events="none" width="100%" height="100%" requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility"><div xmlns="http://www.w3.org/1999/xhtml" style="display: flex; align-items: unsafe center; justify-content: unsafe flex-start; width: 300px; height: 1px; padding-top: 45px; margin-left: 16px;"><div style="box-sizing: border-box; font-size: 0; text-align: left; max-height: 26px; overflow: hidden; color: #000000; "><div style="display: inline-block; font-size: 12px; font-family: Helvetica; color: light-dark(#000000, #ffffff); line-height: 1.2; pointer-events: all; white-space: normal; word-wrap: normal; ">1. </div></div></div></foreignObject><text x="16" y="49" fill="#000000" font-family="Helvetica" font-size="12px" style="fill: light-dark(rgb(0, 0, 0), rgb(255, 255, 255));">1.</text></switch></g></g></g></g><g data-cell-id="aG2ArLrbdNIYtWfDBRse-1"><g transform="translate(0.5,0.5)"><path d="M 400 260 L 400 243.5 Q 400 230 386.5 230 L 13.5 230 Q 0 230 0 243.5 L 0 260" fill="#ffffff" stroke="#000000" stroke-miterlimit="10" pointer-events="all" style="fill: var(--ge-adaptive-bg, #ffffff); stroke: light-dark(rgb(0, 0, 0), rgb(255, 255, 255));"/><path d="M 0 260 L 0 426.5 Q 0 440 13.5 440 L 386.5 440 Q 400 440 400 426.5 L 400 260" fill="none" stroke="#000000" stroke-miterlimit="10" pointer-events="none" style="stroke: light-dark(rgb(0, 0, 0), rgb(255, 255, 255));"/><path d="M 0 260 L 400 260" fill="none" stroke="#000000" stroke-miterlimit="10" pointer-events="none" style="stroke: light-dark(rgb(0, 0, 0), rgb(255, 255, 255));"/></g><g><g><switch><foreignObject style="overflow: visible; text-align: left;" pointer-events="none" width="100%" height="100%" requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility"><div xmlns="http://www.w3.org/1999/xhtml" style="display: flex; align-items: unsafe center; justify-content: unsafe center; width: 398px; height: 1px; padding-top: 245px; margin-left: 1px;"><div style="box-sizing: border-box; font-size: 0; text-align: center; color: #000000; "><div style="display: inline-block; font-size: 12px; font-family: Helvetica; color: light-dark(#000000, #ffffff); line-height: 1.2; pointer-events: all; white-space: normal; word-wrap: normal; ">Process in nodejs</div></div></div></foreignObject><text x="200" y="249" fill="#000000" font-family="Helvetica" font-size="12px" text-anchor="middle" style="fill: light-dark(rgb(0, 0, 0), rgb(255, 255, 255));">Process in nodejs</text></switch></g></g><g data-cell-id="aG2ArLrbdNIYtWfDBRse-2"><g transform="translate(0.5,0.5)"><rect x="0" y="260" width="400" height="90" fill="none" stroke="#000000" stroke-dasharray="1 4" pointer-events="all" style="stroke: light-dark(rgb(0, 0, 0), rgb(255, 255, 255));"/></g><g><g><switch><foreignObject style="overflow: visible; text-align: left;" pointer-events="none" width="100%" height="100%" requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility"><div xmlns="http://www.w3.org/1999/xhtml" style="display: flex; align-items: unsafe center; justify-content: unsafe flex-start; width: 390px; height: 1px; padding-top: 305px; margin-left: 6px;"><div style="box-sizing: border-box; font-size: 0; text-align: left; max-height: 86px; overflow: hidden; color: #000000; "><div style="display: inline-block; font-size: 12px; font-family: Helvetica; color: light-dark(#000000, #ffffff); line-height: 1.2; pointer-events: all; white-space: normal; word-wrap: normal; "><strong><code dir="ltr">worker_threads</code></strong> creates threads in the same process. They each get their own V8 isolate and event loop, but can share memory through <code dir="ltr">SharedArrayBuffer</code> and pass messages cheaply.</div></div></div></foreignObject><text x="6" y="295" fill="#000000" font-family="Helvetica" font-size="12px" style="fill: light-dark(rgb(0, 0, 0), rgb(255, 255, 255));"><tspan x="6" y="295">worker_threads creates threads in the same process. They each get their</tspan><tspan x="6" y="309">own V8 isolate and event loop, but can share memory through</tspan><tspan x="6" y="323">SharedArrayBuffer and pass messages cheaply.</tspan></text></switch></g></g></g><g data-cell-id="aG2ArLrbdNIYtWfDBRse-3"><g transform="translate(0.5,0.5)"><rect x="0" y="350" width="400" height="90" fill="none" stroke="#000000" stroke-dasharray="1 4" pointer-events="all" style="stroke: light-dark(rgb(0, 0, 0), rgb(255, 255, 255));"/></g><g><g><switch><foreignObject style="overflow: visible; text-align: left;" pointer-events="none" width="100%" height="100%" requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility"><div xmlns="http://www.w3.org/1999/xhtml" style="display: flex; align-items: unsafe center; justify-content: unsafe flex-start; width: 390px; height: 1px; padding-top: 395px; margin-left: 6px;"><div style="box-sizing: border-box; font-size: 0; text-align: left; max-height: 86px; overflow: hidden; color: #000000; "><div style="display: inline-block; font-size: 12px; font-family: Helvetica; color: light-dark(#000000, #ffffff); line-height: 1.2; pointer-events: all; white-space: normal; word-wrap: normal; "><strong><code dir="ltr">child_process</code></strong> (<code dir="ltr">spawn</code>, <code dir="ltr">exec</code>, <code dir="ltr">fork</code>) starts a new OS process. Use <code dir="ltr">spawn</code>/<code dir="ltr">exec</code> to run other programs (like <code dir="ltr">ffmpeg</code> or a shell command), and <code dir="ltr">fork</code> to start another Node.js process that talks to the parent over an IPC channel. The <code dir="ltr">cluster</code> module is built on this: it forks several Node processes to use all cores for a server.</div></div></div></foreignObject><text x="6" y="371" fill="#000000" font-family="Helvetica" font-size="12px" style="fill: light-dark(rgb(0, 0, 0), rgb(255, 255, 255));"><tspan x="6" y="371">child_process (spawn, exec, fork) starts a new OS process. Use</tspan><tspan x="6" y="385">spawn/exec to run other programs (like ffmpeg or a shell command), and</tspan><tspan x="6" y="399">fork to start another Node.js process that talks to the parent over an IPC</tspan><tspan x="6" y="413">channel. The cluster module is built on this: it forks several Node</tspan><tspan x="6" y="427">processes to use all cores for a server.</tspan></text></switch></g></g></g></g></g></g></g><switch><g requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility"/><a transform="translate(0,-5)" xlink:href="https://www.drawio.com/doc/faq/svg-export-text-problems" target="_blank"><text text-anchor="middle" font-size="10px" x="50%" y="100%">Text is not SVG - cannot display</text></a></switch></svg>